<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 2: Generative Pattern</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: "Arial", Courier, monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    overflow: hidden;
    transition: background-color 0.6s, color 0.6s;
  }

  #stage {
    position: relative;
    width: min(92vw, 76vh, 720px);
    aspect-ratio: 1 / 1;
    cursor: ew-resize;
    touch-action: none;
  }


  .seed {
    position: absolute;
    left: 50%;
    top: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    user-select: none;
    will-change: transform;
    font-family: "Arial", "Apple Symbols", "Noto Sans Symbols 2", "DejaVu Sans", Arial, sans-serif;
  }

  #caption {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    max-width: 52ch;
  }
</style>
</head>
<body>

<div id="stage" aria-label="Animated spiral of 240 stars arranged like a sunflower head"></div>
<p id="caption"> Click to change the colour scheme: <span id="paletteName">ember</span></p>

<script>
/* ==========================================================
   SEED HEAD — an abstract exercise in form
   ----------------------------------------------------------
   One module (a div) is created 150 times. Each one is placed
   using the "golden angle" (about 137.5 degrees), Each iteration changes:
     1. position  (angle and distance from the centre)
     2. size      (modules grow outward from the centre)
     3. colour    (hue travels along the spiral)
     4. shape     (if / else if picks ★, ✦ or ✴)
   Then requestAnimationFrame slowly rotates and breathes the
   whole pattern. Pointer and clicks change the geometry and colour.
   ========================================================== */

// ---------- settings ----------
const TOTAL = 150;                     // 150 iterations 
const GOLDEN_ANGLE = 137.508;          // degrees

// Colour schemes. Click cycles through them.
// A palette either sweeps a hue range (hueStart, hueEnd, sat, light)
// or blends between exact hex colours listed in `colours`.
const PALETTES = [
  { name: "snowflake",  bg: "#a1d0fc", text: "#ffffff", hueStart: 350, hueEnd: 50,  sat: 0, light: 100 },
  { name: "firework", bg: "#0d1120", text: "#e34775", hueStart: -6, hueEnd: 44, sat: 90, light: 60 },
  { name: "sakura",  bg: "#5b9452", text: "#ffbbc2", colours: ["#ffdddd", "#ffbbc2"] }
];

const stage = document.getElementById("stage");
const paletteLabel = document.getElementById("paletteName");

const seeds = [];                      // every module and its fixed values
let stageSize = stage.getBoundingClientRect().width;

// ---------- 1. BUILD THE PATTERN WITH A LOOP ----------
for (let i = 0; i < TOTAL; i++) {

  // How far out along the spiral is this module? (0 → 1)
  const progress = i / (TOTAL - 1);

  const seed = document.createElement("div");
  seed.className = "seed";

  // --- VARIABLE: SIZE ---
  // Modules start small in the centre and get bigger toward the edge.
  // Every 10th module is an oversized "accent".
  let sizeUnit = 0.9 + progress * 4;            // in % of the stage width
  if (i % 10 === 0) {
    sizeUnit = sizeUnit * 1.6;
  }

  // --- VARIABLE: SHAPE (if / else if chain) ---
  if (i % 3 === 0) {
    seed.textContent = "\u2605\uFE0E";            // ★ solid star
  } else if (i % 3 === 1) {
    seed.textContent = "\u2726\uFE0E";            // ✦ four-point star
  } else {
    seed.textContent = "\u2734\uFE0E";            // ✴ eight-point star
  }

  seeds.push({
    el: seed,
    progress: progress,
    sizeUnit: sizeUnit
  });

  stage.appendChild(seed);
}

// COLOR

let paletteIndex = 0;

function applyPalette() {
  const p = PALETTES[paletteIndex];
  document.body.style.backgroundColor = p.bg;
  document.body.style.color = p.text;
  paletteLabel.textContent = p.name;
}


const rgbCache = {};
function hexToRgb(hex) {
  if (!rgbCache[hex]) {
    const n = parseInt(hex.slice(1), 16);
    rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  return rgbCache[hex];
}

// Smoothly blends along a list of hex colours. position 0 gives the
// first colour, 1 gives the last, and values between mix neighbours.
function blendStops(stops, position) {
  const scaled = position * (stops.length - 1);
  const index = Math.min(Math.floor(scaled), stops.length - 2);
  const frac = scaled - index;
  const a = hexToRgb(stops[index]);
  const b = hexToRgb(stops[index + 1]);
  const r = Math.round(a[0] + (b[0] - a[0]) * frac);
  const g = Math.round(a[1] + (b[1] - a[1]) * frac);
  const bl = Math.round(a[2] + (b[2] - a[2]) * frac);
  return `rgb(${r}, ${g}, ${bl})`;
}

// Paints the moving gradient. A colour wave flows outward along the
// spiral: each module's position in the wave decides where it sits
// between hueStart and hueEnd (or between the palette's `colours`),
// and the wave slides over time.
function paintColours(t) {
  const p = PALETTES[paletteIndex];

  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];

    // wave goes smoothly 0 → 1 → 0, so the colours loop with no jump.
    // 1.5 = how many colour bands fit along the spiral.
    // 0.12 = how fast the bands travel (cycles per second).
    const wave = 0.5 + 0.5 * Math.sin((s.progress * 1.5 - t * 0.12) * Math.PI * 2);

    let colour;
    if (p.colours) {
      colour = blendStops(p.colours, wave);          // exact hex colours
    } else {
      const hue = p.hueStart + (p.hueEnd - p.hueStart) * wave;
      colour = `hsl(${hue}, ${p.sat}%, ${p.light}%)`;
    }

    s.el.style.color = colour;
  }
}

applyPalette();

// ---------- 3. INTERACTIVITY ----------
let pointerX = 0.5;                    // 0 (left) to 1 (right)

stage.addEventListener("pointermove", function (event) {
  const box = stage.getBoundingClientRect();
  pointerX = (event.clientX - box.left) / box.width;
  pointerX = Math.max(0, Math.min(1, pointerX));
});

stage.addEventListener("click", function () {
  paletteIndex = (paletteIndex + 1) % PALETTES.length;
  applyPalette();
});

window.addEventListener("resize", function () {
  stageSize = stage.getBoundingClientRect().width;
});

// ---------- 4. ANIMATION LOOP ----------
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let smoothX = 0.5;                     // eased pointer value so changes feel gentle

function animate(now) {
  const t = reduceMotion ? 0 : now / 1000;

  // Ease toward the pointer instead of jumping.
  smoothX = smoothX + (pointerX - smoothX) * 0.06;

  // The pointer nudges the angle between modules. Tiny changes here
  // completely reshape the spiral arms.
  const angleStep = GOLDEN_ANGLE + (smoothX - 0.5) * 3;

  const maxRadius = stageSize * 0.46;
  const unit = stageSize / 100;

  // Slide the colour gradient along the spiral.
  paintColours(t);

  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];

    // Position: sunflower packing. Radius grows with the square root of i.
    const angle = i * angleStep + t * 4;                // slow overall rotation
    const breathe = 1 + Math.sin(t * 1.2 - s.progress * 5) * 0.025;
    const radius = maxRadius * Math.sqrt(s.progress) * breathe;

    const x = Math.cos(angle * Math.PI / 180) * radius;
    const y = Math.sin(angle * Math.PI / 180) * radius;

    // Each star is turned to follow the spiral.
    const rotation = angle + 90;

    // Size pulses outward in a wave that travels along the spiral.
const pulse = 1 + Math.sin(t * 2 - s.progress * 9) * 0.18;

    const size = s.sizeUnit * unit;
    s.el.style.width = size + "px";
    s.el.style.height = size + "px";
    s.el.style.fontSize = size + "px";
    s.el.style.transform =
      `translate(${x - size / 2}px, ${y - size / 2}px) rotate(${rotation}deg) scale(${pulse})`;
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
